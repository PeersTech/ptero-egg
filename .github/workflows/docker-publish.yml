name: Validate and publish runtime image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - install.sh
      - build-egg.sh
      - egg.meta.json
      - egg-peers-node.json
      - .github/workflows/docker-publish.yml
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - install.sh
      - build-egg.sh
      - egg.meta.json
      - egg-peers-node.json
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate shell and egg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n install.sh entrypoint.sh build-egg.sh

      - name: Regenerate egg
        run: ./build-egg.sh

      - name: Check generated egg is current
        run: git diff --exit-code -- egg-peers-node.json

      - name: Validate generated JSON
        run: jq empty egg-peers-node.json

  push:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/peerstech/ptero-egg
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
